    </div>
  </aside>
  <div class="main-col">

      <button class="btn btn-sm menu-btn" id="menuBtn" type="button" data-action="toggleSidebar" aria-expanded="false" aria-controls="sidebar" aria-label="Open menu"><svg class="ic" width="22" height="22" aria-hidden="true"><use href="#i-menu"/></svg></button>

      <div class="top-r">
        <span id="clock" class="mono muted small" aria-hidden="true"></span>
        <button class="btn btn-sm bell" id="bellBtn" type="button" data-action="openAlerts" aria-label="Notifications"><svg class="ic" width="22" height="22" aria-hidden="true"><use href="#i-bell"/></svg><span class="badge" id="bellBadge" hidden></span></button>
        <div class="who" id="who"></div>
      </div>
    </header>
    <div class="sos-banner" id="sosBanner" role="alert" hidden><svg class="ic" width="22" height="22" aria-hidden="true"><use href="#i-sos"/></svg><span></span><button class="btn btn-sm" type="button" data-action="ackSos">Acknowledge</button></div>
